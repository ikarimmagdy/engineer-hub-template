<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Engineering Hub: the single place the team reviews what is built, planned, the architecture, infrastructure, ADRs, gaps, security, and every feature dossier.">
  <meta name="robots" content="noindex">
  <base href="./">
  <title>Engineering Hub</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Cpath d='M9 16h14M16 9v14' stroke='white' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">

  <link rel="stylesheet" href="assets/css/hub.css">
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>

  <div id="gate" class="gate" hidden>
    <form id="gateForm" class="gate__card" autocomplete="off">
      <div class="gate__mark" aria-hidden="true">
        <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="9" fill="#2563eb"/><path d="M9 16h14M16 9v14" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>
      </div>
      <h1>Engineering Hub</h1>
      <p>Internal engineering portal. This area is restricted to the team.</p>
      <div class="gate__field">
        <label for="gatePass">Access passcode</label>
        <input id="gatePass" type="password" inputmode="text" autocomplete="off" required>
      </div>
      <button class="gate__btn" type="submit">Enter the hub</button>
      <p id="gateErr" class="gate__err" role="alert"></p>
      <p class="gate__note"><b>Soft gate.</b> A shared passcode checked in the browser, not real auth. For an internal share only.</p>
    </form>
  </div>

  <div id="app" hidden>
    <header class="topbar">
      <button id="menuToggle" class="menu-toggle" type="button" aria-label="Open menu" aria-controls="sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <a class="topbar__brand" href="#/overview" aria-label="Engineering Hub home">
        <img src="assets/img/logo.png" alt="" class="brand-logo" onerror="this.remove()">
        <span class="brand-sub">Engineering Hub</span>
      </a>
      <div class="topbar__search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="globalSearch" type="search" placeholder="Search features, ADRs, gaps, docs…" autocomplete="off" aria-label="Search the hub">
        <div id="searchResults" class="search-results" hidden></div>
      </div>
      <div class="topbar__right">
        <button id="themeToggle" class="icon-btn" type="button" aria-label="Toggle theme" title="Toggle light / dark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button id="signout" class="topbar__signout" type="button">Sign out</button>
      </div>
    </header>

    <div class="layout">
      <nav id="sidebar" class="sidebar" aria-label="Hub navigation"></nav>
      <main id="content" class="main" tabindex="-1" role="main"></main>
    </div>
    <div id="scrim" class="scrim" aria-hidden="true"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js"></script>
  <script src="assets/js/hub.js"></script>
  <script src="assets/js/comments.js"></script>
</body>
</html>
