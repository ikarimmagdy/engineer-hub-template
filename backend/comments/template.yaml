AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Engineering Hub comments API (HTTP API + Lambda + DynamoDB)

Parameters:
  AllowOrigin:
    Type: String
    Default: '*'
    Description: CORS origin, e.g. https://your-hub.example.com

Globals:
  Function:
    Timeout: 10
    MemorySize: 128
    Runtime: nodejs20.x

Resources:
  CommentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: engineer-hub-comments
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: id, AttributeType: S }
        - { AttributeName: page, AttributeType: S }
        - { AttributeName: ts, AttributeType: S }
      KeySchema:
        - { AttributeName: id, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: page-index
          KeySchema:
            - { AttributeName: page, KeyType: HASH }
            - { AttributeName: ts, KeyType: RANGE }
          Projection: { ProjectionType: ALL }

  CommentsApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: [ !Ref AllowOrigin ]
        AllowMethods: [ GET, POST, PATCH, OPTIONS ]
        AllowHeaders: [ content-type ]

  CommentsFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handler.handler
      CodeUri: ./
      Environment:
        Variables:
          TABLE: !Ref CommentsTable
          ALLOW_ORIGIN: !Ref AllowOrigin
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref CommentsTable }
      Events:
        List:   { Type: HttpApi, Properties: { ApiId: !Ref CommentsApi, Method: GET,   Path: /comments } }
        Add:    { Type: HttpApi, Properties: { ApiId: !Ref CommentsApi, Method: POST,  Path: /comments } }
        Update: { Type: HttpApi, Properties: { ApiId: !Ref CommentsApi, Method: PATCH, Path: /comments/{id} } }

Outputs:
  ApiUrl:
    Description: Set this (plus /comments) as apiUrl in content/comments-config.json
    Value: !Sub 'https://${CommentsApi}.execute-api.${AWS::Region}.amazonaws.com/comments'
  TableName:
    Value: !Ref CommentsTable
